 <head><meta charset="UTF-8"/>

<style>
.accordioni {
  background-color: #ddd;
  color: #444;
  cursor: pointer;
  padding: 10px;
  border: none;
  text-align: left;
  outline: none;
  font-size: 11px;
  transition: 0.4s;
  width: 236px;
  font-family: Verdana,Arial,Helvetica,sans-serif;
 
}

.active, .accordioni:hover {
  background-color: #ccc;
}

.accordioni:after {
  content: '\002B';
  color: #777;
  font-weight: bold;
  float: right;
  margin-left: 5px;
}

.active:after {
  content: "\2212";
}

.panel {
  padding: 0 18px;
  background-color: white;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.2s ease-out;
    width: 200px;
	margin-top: 2px;
	margin-bottom: 5px;
}


ul, ol, li, h1, h2, h3, h4, h5, h6, pre, form, fieldset, input, p, blockquote, th, td {

}

}
	
.gwt-HTML {

	
	font-size: 10px;

}

img {

		border: 0;
	}

.item-ico {

}

.resultR {

   line-height: normal;
   position: relative;
   padding: 0;
}

.item-label {
    color: #333;

	float: left;

}
b {
 
	color: #000;
	float: left;

}

}

}

.item-fieldvalue {

}

.item-fielddesc {
    display: block;

    padding: 0 8px 4px 0;
    color: #aaa;
    font-size: 9px;
    border-bottom: 1px solid #aaa;
}
.wordwrap {
            word-wrap: break-word;
            word-break: break-all;
}




</style>
<script>


function compare(a, b) {
  //alert (1);
  const arkuszA = a.aktualnosc;
  const arkuszB = b.aktualnosc;

  let comparison = 0;
  if (arkuszA > arkuszB) {
    comparison = 1;
  } else if (arkuszA < arkuszB) {
    comparison = -1;
  }
  return comparison * -1;
}

function createTable (skor_orto_ukosne) {



	skor_orto_ukosne.sort( compare );
	console.log(skor_orto_ukosne.sort(compare));
	
	var textCustom, fLen, icustom;

	fLen = skor_orto_ukosne.length;

	textCustom = "";
		for (icustom = 0; icustom < fLen; icustom++) {
		  
		  textCustom += "<button class='accordioni'>" + skor_orto_ukosne[icustom].godlo + " " + skor_orto_ukosne[icustom].aktualnoscRok  + " " + skor_orto_ukosne[icustom].kierunek + "</button><div class='panel'>";
		  textCustom += "<span class='item-fieldvalue wordwrap' title='Pobierz plik'><a href='"+ skor_orto_ukosne[icustom].url+"'>Pobierz plik danych dla tej sekcji</a><br/></span><span class='item-fielddesc'></span>"
		  textCustom += "<span class='item-fieldname'>Godło</span><span class='item-fieldvalue' title='"+skor_orto_ukosne[icustom].godlo+"'>"+skor_orto_ukosne[icustom].godlo+"</span><span class='item-fielddesc'></span>";
		  textCustom += "<span class='item-fieldname'>Aktualność</span><span class='item-fieldvalue' title='"+ skor_orto_ukosne[icustom].aktualnosc +"'>" + skor_orto_ukosne[icustom].aktualnosc + "</span><span class='item-fielddesc'></span>";
		  textCustom += "<span class='item-fieldname'>Kierunek</span><span class='item-fieldvalue' title='"+skor_orto_ukosne[icustom].kierunek+"'>"+skor_orto_ukosne[icustom].kierunek+"</span><span class='item-fielddesc'></span>";
		  textCustom += "<span class='item-fieldname'>Wielkość piksela</span><span class='item-fieldvalue' title='"+skor_orto_ukosne[icustom].charakterystykaPrzestrzenna+"'>"+skor_orto_ukosne[icustom].charakterystykaPrzestrzenna+"</span><span class='item-fielddesc'></span>";
		  textCustom += "<span class='item-fieldname'>Układ współrzędnych poziomych</span><span class='item-fieldvalue' title='"+skor_orto_ukosne[icustom].ukladWspolrzednychPoziomych+"'>"+skor_orto_ukosne[icustom].ukladWspolrzednychPoziomych+"</span><span class='item-fielddesc'></span>";
		  textCustom += "<span class='item-fieldname'>Cały arkusz wypełniony treścią</span><span class='item-fieldvalue' title='"+skor_orto_ukosne[icustom].calyArkuszWypelnionyTrescia+"'>"+skor_orto_ukosne[icustom].calyArkuszWypelnionyTrescia+"</span><span class='item-fielddesc'></span>";
		  textCustom += "<span class='item-fieldname'>Moduł archiwizacji</span><span class='item-fieldvalue' title='"+skor_orto_ukosne[icustom].modulArchiwizacji+"'>"+skor_orto_ukosne[icustom].modulArchiwizacji+"</span><span class='item-fielddesc'></span>";
		  textCustom += "<span class='item-fieldname'>Źródło danych</span><span class='item-fieldvalue' title='"+skor_orto_ukosne[icustom].zrDanych+"'>"+skor_orto_ukosne[icustom].zrDanych+"</span><span class='item-fielddesc'></span>";
		  textCustom += "<span class='item-fieldname'>Kolor</span><span class='item-fieldvalue' title='"+skor_orto_ukosne[icustom].kolor+"'>"+skor_orto_ukosne[icustom].kolor+"</span><span class='item-fielddesc'></span>";
		  textCustom += "<span class='item-fieldname'>Numer zgłoszenia pracy</span><span class='item-fieldvalue' title='"+skor_orto_ukosne[icustom].numerZgloszeniaPracy+"'>"+skor_orto_ukosne[icustom].numerZgloszeniaPracy+"</span><span class='item-fielddesc'></span>";
		  textCustom += "<span class='item-fieldname'>Data włączenia do PZGiK</span><span class='item-fieldvalue' title='"+ skor_orto_ukosne[icustom].dt_pzgik +"'>" + skor_orto_ukosne[icustom].dt_pzgik + "</span><span class='item-fielddesc'></span>";
		  textCustom += "</div>";
		}

return textCustom;

}


</script>

<script>
var acc = document.getElementsByClassName("accordioni");
var customValue;
console.log(acc.length);

for (customValue = 0; customValue < acc.length; customValue++) {
	console.log(customValue);
  acc[customValue].addEventListener("click", function() {
    this.classList.toggle("active");
    var panel = this.nextElementSibling;
    if (panel.style.maxHeight) {
      panel.style.maxHeight = null;
    } else {
      panel.style.maxHeight = panel.scrollHeight + "px";
    } 
  });
}
</script>
