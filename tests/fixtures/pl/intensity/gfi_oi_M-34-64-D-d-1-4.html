<style>
.accordioni {
  background-color: #ddd;

}

.active, .accordioni:hover {

}

.accordioni:after {
  content: '\002B';

  font-weight: bold;
  float: right;
  margin-left: 5px;
}

.active:after {

}

<script>


function compare(a, b) {
  //alert (1);
  const arkuszA = a.aktualnosc;
  const arkuszB = b.aktualnosc;

  let comparison = 0;
  if (arkuszA > arkuszB) {
    comparison = 1;
  } else if (arkuszA < arkuszB) {
    comparison = -1;
  }
  return comparison * -1;
}

function createTable (skor) {

	skor.sort( compare );
	console.log(skor.sort(compare));
	
	var textCustom, fLen, icustom;

	fLen = skor.length;

	textCustom = "";
	for (icustom = 0; icustom < fLen; icustom++) {
	  
	  textCustom += "<button class='accordioni'>" + skor[icustom].godlo + " " + skor[icustom].aktualnoscRok  + "</button><div class='panel'>";
	  textCustom += "<span class='item-fieldvalue wordwrap' title='Pobierz plik'><a href='"+ skor[icustom].url+"'>Pobierz plik danych dla tej sekcji</a><br/></span><span class='item-fielddesc'></span>"
	  textCustom += "<span class='item-fieldname'>Godło</span><span class='item-fieldvalue' title='"+skor[icustom].godlo+"'>"+skor[icustom].godlo+"</span><span class='item-fielddesc'></span>";
	  textCustom += "<span class='item-fieldname'>Aktualność</span><span class='item-fieldvalue' title='"+ skor[icustom].aktualnosc +"'>" + skor[icustom].aktualnosc + "</span><span class='item-fielddesc'></span>";
	  textCustom += "<span class='item-fieldname'>Wielkość piksela</span><span class='item-fieldvalue' title='"+skor[icustom].wielkoscPiksela+"'>"+skor[icustom].wielkoscPiksela+"</span><span class='item-fielddesc'></span>";
	  textCustom += "<span class='item-fieldname'>Układ współrzędnych</span><span class='item-fieldvalue' title='"+skor[icustom].ukladWspolrzednych+"'>"+skor[icustom].ukladWspolrzednych+"</span><span class='item-fielddesc'></span>";
	  textCustom += "<span class='item-fieldname'>Moduł archiwizacji</span><span class='item-fieldvalue' title='"+skor[icustom].modulArchiwizacji+"'>"+skor[icustom].modulArchiwizacji+"</span><span class='item-fielddesc'></span>";
	  textCustom += "<span class='item-fieldname'>Źródło danych</span><span class='item-fieldvalue' title='"+skor[icustom].zrodloDanych+"'>"+skor[icustom].zrodloDanych+"</span><span class='item-fielddesc'></span>";
	  textCustom += "<span class='item-fieldname'>Metoda zapisu</span><span class='item-fieldvalue' title='"+skor[icustom].metodaZapisu+"'>"+skor[icustom].metodaZapisu+"</span><span class='item-fielddesc'></span>";
	  textCustom += "<span class='item-fieldname'>Zakres intensywności</span><span class='item-fieldvalue' title='"+skor[icustom].zakresIntensywnosci+"'>"+skor[icustom].zakresIntensywnosci+"</span><span class='item-fielddesc'></span>";
	  textCustom += "<span class='item-fieldname'>Numer zgłoszenia pracy</span><span class='item-fieldvalue' title='"+skor[icustom].numerZgloszeniaPracy+"'>"+skor[icustom].numerZgloszeniaPracy+"</span><span class='item-fielddesc'></span>";
	   textCustom += "<span class='item-fieldname'>Data włączenia do PZGiK</span><span class='item-fieldvalue' title='"+ skor[icustom].dt_pzgik +"'>" + skor[icustom].dt_pzgik + "</span><span class='item-fielddesc'></span>";
	  textCustom += "</div>";
	}

return textCustom;

}


</script>

<script>
var acc = document.getElementsByClassName("accordioni");
var customValue;
console.log(acc.length);

for (customValue = 0; customValue < acc.length; customValue++) {
	console.log(customValue);
  acc[customValue].addEventListener("click", function() {
    this.classList.toggle("active");
    var panel = this.nextElementSibling;
    if (panel.style.maxHeight) {
      panel.style.maxHeight = null;
    } else {
      panel.style.maxHeight = panel.scrollHeight + "px";
    } 
  });
}
</script>
