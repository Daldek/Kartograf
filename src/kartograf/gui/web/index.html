<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kartograf: plan i skrypt pobrania danych</title>
<link rel="icon" type="image/svg+xml" href="nogat/marks/kartograf.svg">
<script src="theme-init.js"></script>
<link rel="stylesheet" href="nogat/tokens.css">
<link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
<link rel="stylesheet" href="nogat/nogat-basemaps.css">
<link rel="stylesheet" href="nogat/nogat-app-menu.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="nogat/nogat-app-menu.js"></script>
<script type="module" src="src/main.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <img class="mark" src="nogat/marks/kartograf.svg" alt="" width="24" height="24">
    <span class="name">Kartograf</span>
    <span class="context" data-text="context">Plan i skrypt pobrania danych przestrzennych</span>
    <div class="actions">
      <div class="segmented" role="group" data-label="language">
        <button type="button" data-lang="pl" lang="pl">PL</button>
        <button type="button" data-lang="en" lang="en">EN</button>
      </div>
      <nogat-app-menu current="kartograf" marks="nogat/marks/"></nogat-app-menu>
      <button type="button" class="btn ghost sm" id="theme" data-title="theme" data-label="theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </div>
  </header>
  <nav class="rail" data-label="rail">
    <a class="rail-item active" href="#data" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15"></path><path d="M15 6v15"></path>
      </svg>
      <span data-text="railData">Dane</span>
    </a>
    <button type="button" class="rail-item" id="about-open">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path>
      </svg>
      <span data-text="railAbout">O stronie</span>
    </button>
    <a class="rail-terms" id="rail-terms" href="regulamin.html" target="_blank" rel="noopener" data-text="terms" hidden>Regulamin</a>
  </nav>
  <main class="view-layout" id="data">
    <aside class="panel" id="left">
      <p class="banner bad" id="server-missing" data-text="serverMissing" hidden></p>
      <section>
        <h3 data-text="basemapsHeading">Podkłady kartograficzne</h3>
        <nogat-basemaps></nogat-basemaps>
      </section>
      <p class="note" data-text="keys">Strona nie pyta o klucze API i żadnego nie wysyła.</p>
    </aside>
    <button type="button" class="resizer" data-side="left" aria-controls="left" aria-orientation="vertical"></button>
    <section class="centre">
      <div class="map-bar">
        <span class="hint" data-text="mapLabel">Mapa</span>
      </div>
      <div class="map" id="map" data-label="mapLabel"></div>
    </section>
  </main>
</div>
<dialog class="about" id="about">
  <h2 data-text="aboutHeading">O stronie</h2>
  <p data-text="about1"></p>
  <p data-text="about2"></p>
  <p data-text="keys"></p>
  <p class="note" id="about-version"></p>
  <form method="dialog"><button class="btn" data-text="close">Zamknij</button></form>
</dialog>
</body>
</html>
