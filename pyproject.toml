[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kartograf"
version = "0.3.2"
description = "Tool for downloading NMT (Digital Terrain Model) data from GUGiK"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Piotr", email = "piotr@example.com"}
]
keywords = ["nmt", "dem", "gugik", "gis", "terrain", "geodata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "requests>=2.31.0",
    "pyproj>=3.6.0",
    "PyJWT[crypto]>=2.8.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
]

[project.scripts]
kartograf = "kartograf.cli.commands:main"

[project.urls]
Homepage = "https://github.com/Daldek/Kartograf"
Repository = "https://github.com/Daldek/Kartograf.git"
Issues = "https://github.com/Daldek/Kartograf/issues"

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["kartograf"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
