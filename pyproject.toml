[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kartograf"
dynamic = ["version"]
description = "Download spatial data: DEM/NMT, NMPT, orthophoto and LAZ from GUGiK (PL), DMR 5G/4G from CUZK (CZ), BDOT10k, CORINE (Copernicus) and SoilGrids (ISRIC)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Piotr de Bever", email = "git@debever.pl"}
]
keywords = ["nmt", "dem", "gugik", "gis", "terrain", "geodata", "bdot10k", "corine", "soilgrids", "land-cover", "ortophoto", "cuzk", "czechia", "dmr", "laz", "lidar", "nmpt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "requests>=2.31.0",
    "pyproj>=3.6.0",
    "PyJWT[crypto]>=2.8.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    "pyshp>=2.3.0",
]

[project.scripts]
kartograf = "kartograf.cli.commands:main"

[project.urls]
Homepage = "https://github.com/Daldek/Kartograf"
Repository = "https://github.com/Daldek/Kartograf.git"
Issues = "https://github.com/Daldek/Kartograf/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kartograf*"]

[tool.setuptools.dynamic]
version = {attr = "kartograf.__version__"}

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]

[[tool.mypy.overrides]]
module = ["requests.*", "rasterio.*", "shapefile.*", "affine.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "live: marks tests that require network access to GUGiK WMS (deselect with '-m \"not live\"')",
    "real_wms_layers: opt out of the offline GetCapabilities stub (tests that exercise _fetch_wms_layers itself)",
]

[tool.coverage.run]
source = ["kartograf"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
