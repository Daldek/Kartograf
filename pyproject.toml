[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kartograf"
dynamic = ["version"]
description = "Download spatial data: DEM/NMT, NMPT, orthophoto and LAZ from GUGiK (PL), DMR 5G/4G from CUZK (CZ), BDOT10k, CORINE (Copernicus) and SoilGrids (ISRIC)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Piotr de Bever", email = "git@debever.pl"}
]
keywords = ["nmt", "dem", "gugik", "gis", "terrain", "geodata", "bdot10k", "corine", "soilgrids", "land-cover", "ortophoto", "cuzk", "czechia", "dmr", "laz", "lidar", "nmpt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0",
    "pyproj>=3.6.0",
    "PyJWT[crypto]>=2.8.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    "pyshp>=2.3.0",
    "pyogrio>=0.10",
]

[project.scripts]
kartograf = "kartograf.cli.commands:main"
kartograf-mcp = "kartograf.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Daldek/Kartograf"
Repository = "https://github.com/Daldek/Kartograf.git"
Issues = "https://github.com/Daldek/Kartograf/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kartograf*"]

[tool.setuptools.package-data]
kartograf = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "kartograf.__version__"}

[project.optional-dependencies]
# MCP SDK v2: kartograf.mcp_server uses its low-level Server API; a major
# release of the SDK may break it (known incompatibility, DEV-6.4).
mcp = ["mcp>=2.3.0,<3"]

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8.0", "pytest-cov>=5.0"]

[tool.ruff]
target-version = "py312"
line-length = 88
# Local Claude Code settings and temporary agent worktrees (also in .gitignore);
# Markdown code blocks are documentation examples, not formatted by ruff.
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Same as ruff: never descend into local agent worktrees (mypy .)
exclude = ['^\.claude/']

[[tool.mypy.overrides]]
module = ["requests.*", "rasterio.*", "shapefile.*", "affine.*", "pyogrio.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# The default run and the gate exclude `live` (DEV-10.1); `-m live` replaces it.
addopts = "--strict-markers -m 'not live' --tb=short"
markers = [
    "live: real network services (GUGiK, CUZK, CLMS, ISRIC); run on demand and weekly in CI",
    "slow: more than ~10 s or Docker",
    "db: needs a database (none in this project)",
    "real_wms_layers: opt out of the offline GetCapabilities stub (tests that exercise _fetch_wms_layers itself)",
    "real_wfs_types: opt out of the offline WFS feature-type stub of the NMT/NMPT index services (tests that exercise WfsIndex.feature_types itself)",
]

[tool.coverage.run]
source = ["kartograf"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
